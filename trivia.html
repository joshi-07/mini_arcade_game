<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trivia Quiz — Mini Game Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="pb-body game-page">
  <main class="wrap">
    <header class="hero small">
      <h1 class="brand">Trivia Quiz</h1>
      <p class="lead">Answer questions quickly. Enter your name and start!</p>
    </header>

    <section class="game-grid">
      <div class="card game-card right-card">
        <label class="field">
          <span class="label-text">Your name</span>
          <input id="playerName" type="text" maxlength="32" placeholder="Your name..." />
        </label>

        <div id="questionContainer" class="question-container">
          <h3 id="question" class="question"></h3>
          <div id="answers" class="answers">
            <!-- Answer buttons will be generated here -->
          </div>
        </div>

        <p id="hint" class="muted hint">Choose the correct answer!</p>
        <p id="result" class="result"></p>

        <div class="actions">
          <button id="startBtn" class="btn btn-primary">Start Quiz</button>
          <a class="btn btn-ghost" href="leaderboard.html">View Leaderboard</a>
        </div>
      </div>

      <aside class="card right-card">
        <h3 class="card-title">Leaderboard</h3>
        <ol id="leaderList" class="leader-list">
          <!-- Populated by JS -->
        </ol>
        <p class="muted small">Top scores saved to localStorage.</p>
      </aside>
    </section>

    <footer class="foot muted">Show off your knowledge!</footer>
  </main>

  <script src="static/js/trivia.js"></script>
  <script>
  function populateLeaderboard() {
    const scores = JSON.parse(localStorage.getItem('scores') || '[]');
    const triviaScores = scores.filter(s => s.game === 'trivia').sort((a,b) => b.score - a.score).slice(0, 10);
    const list = document.getElementById('leaderList');
    list.innerHTML = triviaScores.map(s => `<li><strong>${s.name}</strong><span class="muted"> — ${s.score} pts</span></li>`).join('');
  }
  populateLeaderboard();
  </script>
</body>
</html>
