<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reaction Speed — Mini Game Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="pb-body game-page">
  <main class="wrap">
    <header class="hero small">
      <h1 class="brand">Reaction Speed</h1>
      <p class="lead">Enter your name, then click when the box turns green. Good luck!</p>
    </header>

    <section class="game-grid">
      <div class="card game-card right-card">
        <label class="field">
          <span class="label-text">Your name</span>
          <input id="playerName" type="text" maxlength="32" placeholder="Your name..." />
        </label>

        <div id="gameBox" class="game-box" role="button" aria-pressed="false" tabindex="0">
          <div class="game-inner">
            <div id="countdown" class="countdown"></div>
            <div id="boxText" class="box-text">Click to start</div>
          </div>
        </div>

        <p id="hint" class="muted hint">Wait for green, then click!</p>
        <p id="result" class="result"></p>
        <div class="progress-bar"><div class="progress-fill" id="scoreProgress"></div></div>

        <div class="actions">
          <button id="restartBtn" class="btn btn-ghost">Restart</button>
          <a class="btn btn-primary" href="leaderboard.html">View Leaderboard</a>
        </div>
      </div>

      <aside class="card right-card">
        <h3 class="card-title">Leaderboard</h3>
        <ol id="leaderList" class="leader-list">
          <!-- Populated by JS -->
        </ol>
        <p class="muted small">Top scores saved locally (localStorage).</p>
      </aside>
    </section>

    <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

    <!-- Game Feedback Modal -->
    <div id="feedbackModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="feedbackTitle">Great Score!</h2>
        <p id="feedbackMessage">You scored high! Keep playing to beat your record.</p>
        <button class="btn btn-primary" onclick="closeFeedbackModal()">Continue</button>
      </div>
    </div>

    <footer class="foot muted">Have fun — no cheating 😉</footer>
  </main>

  <script src="static/js/game1.js"></script>
  <script>
  function populateLeaderboard() {
    const scores = JSON.parse(localStorage.getItem('scores') || '[]');
    const reactionScores = scores.filter(s => s.game === 'reaction').sort((a,b) => b.score - a.score).slice(0, 10);
    const list = document.getElementById('leaderList');
    list.innerHTML = reactionScores.map(s => `<li><strong>${s.name}</strong><span class="muted"> — ${s.score} pts</span></li>`).join('');
  }
  populateLeaderboard();
  </script>
</body>
</html>
